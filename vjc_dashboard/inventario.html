<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>VJC Technology — Inventario</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<aside class="sidebar">
  <div class="sidebar-logo">VJC Technology</div>
  <nav class="sidebar-nav">
    <a href="dashboard.html" class="nav-item"><span class="nav-icon">▦</span> Dashboard</a>
    <a href="servicios.html" class="nav-item"><span class="nav-icon">⚙</span> Servicios Activos</a>
    <a href="clientes.html" class="nav-item"><span class="nav-icon">👥</span> Clientes</a>
    <a href="ordenes.html" class="nav-item"><span class="nav-icon">📋</span> Órdenes de Trabajo</a>
    <a href="cotizaciones.html" class="nav-item"><span class="nav-icon">💲</span> Cotizaciones</a>
    <a href="inventario.html" class="nav-item active"><span class="nav-icon">📦</span> Inventario</a>
    <a href="agenda.html" class="nav-item"><span class="nav-icon">📅</span> Agenda</a>
    <a href="notas.html" class="nav-item"><span class="nav-icon">💬</span> Notas internas</a>
  </nav>
  <div class="sidebar-user">
    <div class="user-avatar">JC</div>
    <div><div class="user-name">Juan Colega</div><div class="user-role">Técnico</div></div>
  </div>
  <button class="logout-btn" onclick="vjcLogout()">
    <span class="nav-icon">⎋</span> Cerrar sesión
  </button>
</aside>

<main class="main">
  <header class="topbar">
    <button class="mob-toggle" id="mobToggle" aria-label="Abrir menú">
      <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <h1 class="page-title">Inventario / Catálogo</h1>
    <div class="topbar-actions">
      <button class="btn btn-primary" onclick="openModal()">+ Agregar producto</button>
    </div>
  </header>

  <div class="search-bar">
    <input class="search-input" type="text" placeholder="Buscar producto..." oninput="filtrar(this.value)"/>
    <select class="form-select" style="width:150px" onchange="filtrarCat(this.value)">
      <option value="">Todas las categorías</option>
      <option value="Licencias">Licencias</option>
      <option value="Hardware">Hardware</option>
      <option value="Software">Software</option>
      <option value="Servicio">Servicio</option>
    </select>
  </div>

  <section class="card">
    <table class="table">
      <thead><tr><th>Producto</th><th>Categoría</th><th>Stock</th><th>Precio unitario</th><th>Estado</th><th>Acciones</th></tr></thead>
      <tbody id="tbody-inv"></tbody>
    </table>
  </section>
</main>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-title" id="modal-titulo">Nuevo Producto</div>
    <div class="form-grid">
      <div class="form-group"><label class="form-label">Nombre</label><input class="form-input" id="i-nombre" placeholder="Ej: Licencia Windows 11"/></div>
      <div class="form-group"><label class="form-label">Categoría</label>
        <select class="form-select" id="i-cat">
          <option>Licencias</option><option>Hardware</option><option>Software</option><option>Servicio</option>
        </select>
      </div>
      <div class="form-group"><label class="form-label">Stock</label><input class="form-input" id="i-stock" type="number" value="1"/></div>
      <div class="form-group"><label class="form-label">Stock mínimo</label><input class="form-input" id="i-stock-min" type="number" value="2"/></div>
      <div class="form-group"><label class="form-label">Precio (S/)</label><input class="form-input" id="i-precio" type="number" step="0.01" value="0"/></div>
      <div class="form-group"><label class="form-label">Proveedor</label><input class="form-input" id="i-proveedor" placeholder="Opcional"/></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="guardar()">Guardar</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script>
let inventario = [];
let editandoId = null;

function estadoDe(p){
  if (p.cantidad === 0) return 'agotado';
  if (p.cantidad <= p.cantidad_minima) return 'bajo';
  return 'disponible';
}

async function cargarInventario(){
  const { data, error } = await sb.from('inventario').select('*').order('nombre');
  if (error) { supaError(error, 'Error cargando inventario'); return; }
  inventario = data || [];
  aplicarFiltros();
}

let filtroText='', filtroCat='';

function renderInv(data){
  const tbody = document.getElementById('tbody-inv');
  if (!data.length) { tbody.innerHTML = '<tr><td colspan="6"><div class="empty-state">Sin productos</div></td></tr>'; return; }
  tbody.innerHTML = data.map(p=>{
    const est = estadoDe(p);
    return `
    <tr>
      <td style="font-weight:600;color:#2d2d4e;cursor:pointer" onclick="editar('${p.id}')">${esc(p.nombre)}</td>
      <td><span class="badge purple">${esc(p.categoria || '-')}</span></td>
      <td style="font-weight:700;color:${est==='agotado'?'#e85959':est==='bajo'?'#f0b429':'#2d9e5f'}">${p.cantidad}</td>
      <td style="font-weight:700;color:#2d2d4e">S/ ${Number(p.precio_unitario||0).toFixed(2)}</td>
      <td><span class="badge ${est==='disponible'?'green':est==='bajo'?'yellow':'red'}">${est==='disponible'?'Disponible':est==='bajo'?'Stock bajo':'Agotado'}</span></td>
      <td style="display:flex;gap:6px">
        <button class="btn btn-secondary btn-sm" onclick="ajustarStock('${p.id}',-1)">−</button>
        <button class="btn btn-primary btn-sm" onclick="ajustarStock('${p.id}',1)">+</button>
      </td>
    </tr>
  `}).join('');
}

async function ajustarStock(id,delta){
  const p = inventario.find(x=>x.id===id);
  if (!p) return;
  if (delta < 0 && p.cantidad <= 0) return;
  const { error } = await sb.from('inventario_movimientos').insert({
    inventario_id: id,
    tipo: delta > 0 ? 'entrada' : 'salida',
    cantidad: 1,
    motivo: 'Ajuste manual desde el dashboard'
  });
  if (error) { supaError(error, 'No se pudo ajustar el stock'); return; }
  cargarInventario();
}

function filtrar(v){ filtroText=v.toLowerCase(); aplicarFiltros(); }
function filtrarCat(v){ filtroCat=v; aplicarFiltros(); }
function aplicarFiltros(){
  renderInv(inventario.filter(p=>
    (!filtroText||p.nombre.toLowerCase().includes(filtroText))&&
    (!filtroCat||p.categoria===filtroCat)
  ));
}

function openModal(){
  editandoId = null;
  document.getElementById('modal-titulo').textContent = 'Nuevo Producto';
  document.getElementById('i-nombre').value = '';
  document.getElementById('i-cat').selectedIndex = 0;
  document.getElementById('i-stock').value = 1;
  document.getElementById('i-stock-min').value = 2;
  document.getElementById('i-precio').value = 0;
  document.getElementById('i-proveedor').value = '';
  document.getElementById('modal').classList.add('open');
}
function closeModal(){ document.getElementById('modal').classList.remove('open'); }

function editar(id){
  const p = inventario.find(x=>x.id===id);
  if (!p) return;
  editandoId = id;
  document.getElementById('modal-titulo').textContent = 'Editar Producto';
  document.getElementById('i-nombre').value = p.nombre;
  document.getElementById('i-cat').value = p.categoria || 'Licencias';
  document.getElementById('i-stock').value = p.cantidad;
  document.getElementById('i-stock-min').value = p.cantidad_minima;
  document.getElementById('i-precio').value = p.precio_unitario || 0;
  document.getElementById('i-proveedor').value = p.proveedor || '';
  document.getElementById('modal').classList.add('open');
}

async function guardar(){
  const payload = {
    nombre: document.getElementById('i-nombre').value.trim() || 'Producto',
    categoria: document.getElementById('i-cat').value,
    cantidad: parseInt(document.getElementById('i-stock').value) || 0,
    cantidad_minima: parseInt(document.getElementById('i-stock-min').value) || 0,
    precio_unitario: parseFloat(document.getElementById('i-precio').value) || 0,
    proveedor: document.getElementById('i-proveedor').value.trim() || null
  };
  const query = editandoId
    ? sb.from('inventario').update(payload).eq('id', editandoId)
    : sb.from('inventario').insert(payload);
  const { error } = await query;
  if (error) { supaError(error, 'Error guardando producto (puede requerir rol admin)'); return; }
  showToast(editandoId ? 'Producto actualizado' : 'Producto agregado');
  closeModal();
  cargarInventario();
}

(async function init(){
  const session = await window.vjcAuthReady;
  if (!session) return;
  cargarInventario();
})();
</script>

<script>
(function(){
  var toggle = document.getElementById('mobToggle');
  var sidebar = document.querySelector('.sidebar');
  var overlay = document.getElementById('sidebarOverlay');
  function openSidebar(){
    sidebar.classList.add('mob-open');
    overlay.classList.add('open');
  }
  function closeSidebar(){
    sidebar.classList.remove('mob-open');
    overlay.classList.remove('open');
  }
  if(toggle) toggle.addEventListener('click', openSidebar);
  if(overlay) overlay.addEventListener('click', closeSidebar);
  // close on nav link click
  var navLinks = document.querySelectorAll('.nav-item, .logout-btn');
  navLinks.forEach(function(l){ l.addEventListener('click', closeSidebar); });
})();
</script>
</body>
</html>
