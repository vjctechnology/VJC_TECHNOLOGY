<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VJC Technology — Iniciar sesión</title>
  <link href="favicon.svg" rel="icon" type="image/svg+xml"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #eeeef8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 28px 36px;
    }

    /* Logo */
    .logo {
      font-size: 15px;
      font-weight: 700;
      color: #9b7de0;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 0;
      text-decoration: none;
      display: inline-block;
      cursor: pointer;
    }
    .logo:hover { color: #7c3aed; }

    /* Center card */
    .center {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 80px);
    }

    .card {
      background: #ffffff;
      border-radius: 18px;
      padding: 44px 44px 40px;
      width: 100%;
      max-width: 430px;
    }

    .card-title {
      font-size: 28px;
      font-weight: 700;
      color: #9b7de0;
      text-align: center;
      margin-bottom: 32px;
    }

    /* Fields */
    .field-group { margin-bottom: 20px; }

    .field-label {
      display: block;
      font-size: 13px;
      color: #7a9ab5;
      margin-bottom: 7px;
    }

    .field-input {
      width: 100%;
      height: 50px;
      border: 1.5px solid #d8e4ee;
      border-radius: 10px;
      padding: 0 14px;
      font-size: 14px;
      color: #333;
      background: #fff;
      outline: none;
      transition: border-color 0.2s;
    }

    .field-input:focus { border-color: #9b7de0; }

    /* Password wrapper */
    .pwd-wrap { position: relative; }

    .pwd-wrap .field-input { padding-right: 46px; }

    .eye-btn {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #7a9ab5;
      padding: 0;
      display: flex;
      align-items: center;
    }

    .eye-btn svg {
      width: 20px;
      height: 20px;
      stroke: #7a9ab5;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Button */
    .login-btn {
      width: 100%;
      height: 50px;
      background: #9b7de0;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      letter-spacing: 0.02em;
      transition: background 0.2s;
    }

    .login-btn:hover { background: #8b6cd0; }
    .login-btn:active { background: #7a5bbf; }
  </style>
  <!-- ================= MOBILE RESPONSIVE ================= -->

        padding: 16px 16px 32px;
        align-items: center;
      }

        font-size: 13px;
        margin-bottom: 0;
        align-self: flex-start;
      }

        min-height: calc(100vh - 60px);
        padding: 0;
      }

        padding: 28px 20px 24px;
        border-radius: 14px;

        font-size: 22px;

        height: 48px;
        font-size: 16px; /* evita zoom en iOS */

        height: 48px;
        font-size: 15px;
        border-radius: 9px;

<body>

  <a href="index.html" class="logo">VJC Technology</a>

  <div class="center">
    <div class="card">
      <div class="card-title">Iniciar sesión</div>

      <div class="field-group">
        <label class="field-label" for="email">Correo electrónico</label>
        <input class="field-input" type="email" id="email" autocomplete="email" />
      </div>

      <div class="field-group">
        <label class="field-label" for="pwd">Contraseña</label>
        <div class="pwd-wrap">
          <input class="field-input" type="password" id="pwd" autocomplete="current-password" />
          <button class="eye-btn" type="button" onclick="togglePwd()" aria-label="Mostrar contraseña">
            <svg id="eye-icon" viewBox="0 0 24 24">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <p id="loginError" style="display:none; color:#e14b4b; font-size:13px; margin-top:-10px; margin-bottom:14px;">
        Correo o contraseña incorrectos.
      </p>

      <button class="login-btn" type="button" onclick="vjcFakeLogin()">Iniciar sesión</button>
    </div>
  </div>

  <script>
    // ===================================================================
    // ⚠️ BORRAR URGENTE CUANDO SE IMPLEMENTE EL BACKEND ⚠️
    // Login simulado / temporal (SIN backend todavía).
    // Credenciales hardcodeadas SOLO para revisión visual del dashboard.
    // Reemplazar por la llamada real a la API de autenticación
    // (validación de usuario, manejo de sesión/token, etc.) apenas
    // ===================================================================
    // Login real con Supabase Auth
    // ===================================================================
    const SUPABASE_URL = 'https://oxtggipvbgkblygynpkn.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im94dGdnaXB2YmdrYmx5Z3lucGtuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4MDM0NDUsImV4cCI6MjEwMTM3OTQ0NX0.P-O1en1Gv2hBq-JWftmq8OJXhrcAfjvNhHa_xi9YmAU';

    const { createClient } = supabase;
    const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function vjcFakeLogin() {
      const email = document.getElementById('email').value.trim();
      const pwd = document.getElementById('pwd').value;
      const errorMsg = document.getElementById('loginError');
      const btn = document.querySelector('.login-btn');

      btn.disabled = true;
      btn.textContent = 'Iniciando sesión...';
      errorMsg.style.display = 'none';

      const { error } = await _supabase.auth.signInWithPassword({ email, password: pwd });

      if (error) {
        errorMsg.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Iniciar sesión';
      } else {
        window.location.href = 'https://vjc-fixed-8oca.vercel.app/vjc_dashboard/dashboard.html';
      }
    }
  </script>
